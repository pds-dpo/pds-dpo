dataset_path: lmms-lab/POPE
dataset_kwargs:
  revision: 4db1276663dfa5eb8ad16a52d24c31a09e470896
  token: true
task: synthalign_v10_full_pope
test_split: test
output_type: generate_until
doc_to_visual: !function pope_utils.pope_doc_to_visual
doc_to_text: !function pope_utils.pope_doc_to_text
doc_to_target: answer
generation_kwargs:
  max_new_tokens: 128
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function pope_utils.pope_process_results_strict
metric_list:
  - metric: pope_accuracy
    aggregation: !function pope_utils.pope_aggregate_accuracy
    higher_is_better: true
  - metric: pope_precision
    aggregation: !function pope_utils.pope_aggregate_precision
    higher_is_better: true
  - metric: pope_recall
    aggregation: !function pope_utils.pope_aggregate_recall
    higher_is_better: true
  - metric: pope_f1_score
    aggregation: !function pope_utils.pope_aggregate_f1_score
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer the question using a single word or phrase."
metadata:
  version: 1.0
  parser: upstream_strict_exact_yes_no
  note: Correct predicted yes-ratio and manuscript-compatible normalization are computed post hoc.


process_docs: !function full_tasks.pope
